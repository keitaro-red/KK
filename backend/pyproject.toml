[project]
name = "kk-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "arq>=0.26.3",
    "python-dotenv>=1.1.0",
    "pyjwt>=2.13.0",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.31",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "kk",
    "langchain>=1.3.9",
    "langchain-openai>=1.0.2",
    "langgraph>=1.0.1",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv.sources]
kk = { path = "package", editable = true }

[dependency-groups]
dev = ["ruff>=0.12.1"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]
